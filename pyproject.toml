[project]
name = "e-commerce-scraper"
version = "0.1.0"
description = "Web scraper for e-commerce static site using Beautiful Soup"
authors = [{name = "Student", email = "student@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.uv]
managed = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
